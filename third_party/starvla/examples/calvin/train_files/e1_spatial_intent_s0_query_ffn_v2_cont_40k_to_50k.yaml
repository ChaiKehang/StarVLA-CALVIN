# V2 S0 low-LR continuation: warm-start model weights from the completed 40k
# run, but deliberately start a fresh AdamW optimizer and 10k-step scheduler.
# W&B logging is offset to 40k so it can continue the original run history.
run_id: e1_spatial_intent_query_ffn_v2_s0_cont_40k_to_50k
wandb_name: e1_spatial_intent_query_ffn_v2_s0_40000
run_root_dir: /home/data/models/kehang-StarVLA/checkpoints/calvin
seed: 42
wandb_entity: chaikehang-sjtu-hpc-center
wandb_project: starVLA_Calvin_E1_Spatial_Intent_S0_V2
is_debug: false
version_id: "e1_spatial_intent_query_ffn_v2_s0_cont_v1"

framework:
  name: QwenPIIntent_v3

  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 16
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32

    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

  intent:
    training_stage: s0
    use_multilayer_aggregator: true
    source_layers: [4, 8, 12, 16, 20, 24, 28, 32, 36]
    # The 40k checkpoint already contains trained Intent projectors. Recopying
    # Action projector weights here would silently destroy that learned state.
    initialize_projectors_from_action: false
    use_layer_position_embedding: true

    aggregator_block_type: query_ffn_v2
    token_query_use_ffn: true
    layer_query_use_ffn: true
    query_ffn_multiplier: 2.0
    query_ffn_dropout: 0.1
    query_attention_dropout: 0.0
    query_norm_eps: 1.0e-5

    action_condition_source: probabilities
    return_attention_diagnostics: true
    attention_diagnostics_interval: 100

    use_aux_loss: true
    add_to_timestep_embedding: false
    use_ffn_film: false
    use_cross_attn_query_film: false
    loss_weight: 0.1
    hidden_size: 1024
    num_attention_heads: 16
    classifier_hidden_size: 512
    num_classes: 125
    dropout: 0.1
    pooler_type: learned_query

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    include_intent: true
    intent_class_column: intent.class_id
    intent_num_classes: 125
    data_root_dir: /home/data/datasets/kehang-CALVIN/calvin/lerobot
    data_mix: calvin_abc_d_sixpigs_rel_scaled_intent125_h8
    action_mode: abs
    action_type: calvin_scaled_rel_actions
    CoT_prompt: "Your task is {instruction}."
    per_device_batch_size: 48
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  # This is a fresh local phase, not recover/resume. Local steps are 0..10k;
  # W&B steps are 40k..50k through wandb_step_offset.
  pretrained_checkpoint: /home/liuchang/kehang/488project/code/starvla/playground/Pretrained_models/kehang-StarVLA/checkpoints/calvin/e1_spatial_intent_query_ffn_v2_s0_40000/final_model/pytorch_model.pt
  is_resume: false
  max_train_steps: 10000
  num_warmup_steps: 0
  wandb_step_offset: 40000
  training_phase_id: 1

  save_interval: 5000
  eval_interval: 1000
  enable_action_eval: false
  repeated_diffusion_steps: 16

  learning_rate:
    base: 2.0e-06
    intent_head.project_layers: 2.0e-06
    intent_head.token_query_block.attention: 2.0e-06
    intent_head.token_query_block.ffn: 2.0e-06
    intent_head.layer_query_block.attention: 2.0e-06
    intent_head.layer_query_block.ffn: 2.0e-06
    intent_head.classifier: 4.0e-06
    intent_head: 2.0e-06

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr_rate: 0.25

  freeze_modules: qwen_vl_interface,action_model,project_layers,intent_to_timestep
  loss_scale:
    vla: 1.0
    vlm: 0.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
