run_id: e1_factorized_spatial_intent_s0_50k
run_root_dir: /home/data/models/kehang-StarVLA/checkpoints/calvin
seed: 42
wandb_entity: disabled
wandb_project: starVLA_Calvin_E1_Factorized_Intent_S0
is_debug: false
version_id: "e1_factorized_spatial_intent_s0_v1"

framework:
  name: QwenPIIntent_v3
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 16
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64
  intent:
    training_stage: s0
    factorized: true
    use_multilayer_aggregator: true
    source_layers: [4, 8, 12, 16, 20, 24, 28, 32, 36]
    initialize_projectors_from_action: false
    use_layer_position_embedding: true
    aggregator_block_type: query_ffn_v2
    query_ffn_multiplier: 2.0
    query_ffn_dropout: 0.1
    query_attention_dropout: 0.05
    query_norm_eps: 1.0e-5
    return_attention_diagnostics: true
    attention_diagnostics_interval: 100
    use_aux_loss: true
    add_to_timestep_embedding: false
    use_ffn_film: false
    use_cross_attn_query_film: false
    use_entropy_confidence_gate: false
    loss_weight: 1.0
    hidden_size: 1024
    num_attention_heads: 16
    classifier_hidden_size: 512
    gripper_classifier_hidden_size: 256
    dropout: 0.1

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.vl
    per_device_batch_size: 4
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    include_intent: true
    factorized_intent: true
    data_root_dir: /home/data/datasets/kehang-CALVIN/calvin/lerobot
    data_mix: calvin_abc_factorized_intent_h8
    trajectory_manifest: meta/splits/factorized_seed42_train.json
    validation_trajectory_manifest: meta/splits/factorized_seed42_val.json
    action_mode: abs
    action_type: calvin_scaled_rel_actions
    CoT_prompt: "Your task is {instruction}."
    per_device_batch_size: 32
    load_all_data_for_training: true
    video_backend: torchvision_av
    num_workers: 4

trainer:
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 1000
  enable_action_eval: false
  intent_validation_interval: 1000
  intent_validation_full_interval: 5000
  intent_validation_subset_batches: 128
  repeated_diffusion_steps: 16
  learning_rate:
    base: 5.0e-05
    intent_head.project_layers: 5.0e-05
    intent_head.token_query_block: 5.0e-05
    intent_head.layer_query_blocks: 5.0e-05
    intent_head.xyz_classifier: 1.0e-04
    intent_head.rpy_classifier: 1.0e-04
    intent_head.gripper_classifier: 1.0e-04
    intent_head: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface,action_model,project_layers,intent_to_timestep
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
